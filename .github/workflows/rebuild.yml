# Ricostruisce il sito su Vercel ogni giorno, così il sync vede i repo nuovi o cambiati.
# Il cron gira solo dal branch di default; GitHub lo sospende dopo 60 giorni senza attività nel repo (si riattiva a mano).
name: Rebuild

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC: minuto "storto" per evitare i ritardi a inizio ora
  workflow_dispatch: # bottone "Run workflow" nella scheda Actions

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "Secret VERCEL_DEPLOY_HOOK mancante"; exit 1; }
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy richiesto"
